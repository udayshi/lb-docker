
services:
  lb:
    image: nginx:latest
    environment:
      - VIRTUAL_HOST=lb.docker
    volumes:
      - ./conf/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web1
      - web2

  web1:
    image: nginx:latest
    volumes:
      - "./one:/usr/share/nginx/html" 
  web2:
      image: nginx:latest
      volumes:
        - "./two:/usr/share/nginx/html" 
